name: Build and Sign Firefox Extension

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to process"
        required: true
        type: string

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "latest"

      - name: Setup PNPM
        uses: pnpm/action-setup@v6
        with:
          version: "latest"

      - name: PNPM Install
        run: pnpm ci

      - name: Building extensions
        run: pnpm exec wxt build -b firefox

      - name: Sign or recover Firefox XPI
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          pnpm web-ext sign \
            --source-dir .output/firefox-mv2 \
            --api-key "$AMO_JWT_ISSUER" \
            --api-secret "$AMO_JWT_SECRET" \
            --channel unlisted

      - name: Save signed XPI
        uses: actions/upload-artifact@v7
        with:
          name: firefox-xpi-${{ env.RELEASE_TAG }}
          path: web-ext-artifacts/kotatsu-sync-*-firefox.xpi
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build-and-sign
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

    steps:
      - name: Download signed XPI
        uses: actions/download-artifact@v5
        with:
          name: firefox-xpi-${{ env.RELEASE_TAG }}
          path: web-ext-artifacts

      - name: Upload XPI to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          XPI="web-ext-artifacts/kotatsu-sync-${RELEASE_TAG}-firefox.xpi"

          test -f "$XPI"

          echo "Uploading $XPI to release $RELEASE_TAG..."

          if gh release view "$RELEASE_TAG" \
            --json assets \
            --jq '.assets[].name' |
            grep -Fxq "$(basename "$XPI")"; then
            echo "XPI already exists on release. Nothing to do."
            exit 0
          fi

          gh release upload \
            "$RELEASE_TAG" \
            "$XPI"

          echo "Release upload complete."
